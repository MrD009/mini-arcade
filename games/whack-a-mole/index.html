<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>🔨 Whack-a-Mole | Mini Arcade</title>
  <style>
    :root {
      --bg: #0d0d1a;
      --card-bg: #16162e;
      --accent: #00f2ff;
      --accent2: #ff00aa;
      --gold: #ffd700;
      --green: #00ff88;
      --red: #ff4444;
      --text: #f5f5f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding: 8px 8px calc(70px + env(safe-area-inset-bottom)) 8px;
    }

    body.shake { animation: shakeScreen 0.35s ease; }

    .bg-mesh {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 242, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 170, 0.08) 0%, transparent 40%),
        var(--bg);
    }

    header {
      text-align: center;
      margin-bottom: 3px;
      flex-shrink: 0;
      animation: fadeInDown 0.6s ease;
    }

    h1 {
      font-size: clamp(1.3rem, 4vw, 1.9rem);
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(0,242,255,0.3);
      line-height: 1.2;
    }

    .subtitle { color: #888; font-size: 0.8rem; margin-top: 2px; }

    .difficulty-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 3px;
      flex-wrap: wrap;
      justify-content: center;
      flex-shrink: 0;
    }

    .difficulty-bar button {
      padding: 4px 8px;
      font-size: 0.65rem;
      border: 1px solid transparent;
      background: var(--card-bg);
      color: var(--text);
    }

    .difficulty-bar button.active {
      border-color: var(--accent);
      background: rgba(0, 242, 255, 0.15);
      box-shadow: 0 0 10px rgba(0,242,255,0.2);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      font-size: 0.8rem;
      margin-bottom: 3px;
      width: 100%;
      max-width: min(94vw, 460px);
      flex-shrink: 0;
    }

    .stat {
      background: var(--card-bg);
      padding: 3px 4px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .stat span { color: var(--accent); font-weight: bold; font-size: 0.85rem; }
    .stat .label { display: block; font-size: 0.58rem; color: #888; margin-top: 1px; }
    .stat.low-time span { color: var(--red); }

    .progress-wrap {
      width: 100%;
      max-width: min(94vw, 460px);
      margin-bottom: 3px;
      flex-shrink: 0;
    }

    .progress-bar {
      height: 6px;
      background: var(--card-bg);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.4);
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 3px;
      transition: width 1s linear;
      box-shadow: 0 0 8px rgba(0,242,255,0.4);
    }

    .progress-fill.low { background: linear-gradient(90deg, var(--red), var(--gold)); }

    .audio-controls {
      margin-bottom: 3px;
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .audio-controls button {
      background: #2a2a4a;
      padding: 4px 8px;
      margin: 0;
      font-size: 0.62rem;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 2.5vw, 18px);
      width: var(--board-width, min(94vw, 420px));
      margin: 0 auto;
      flex: 0 0 auto;
      position: relative;
    }

    .hole {
      aspect-ratio: 1;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: linear-gradient(180deg, #3a2a14, #1c130a);
      box-shadow: inset 0 8px 18px rgba(0,0,0,0.6), 0 3px 8px rgba(0,0,0,0.35);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      border: 1px solid rgba(255,255,255,0.05);
      outline: none;
    }

    .hole:focus-visible {
      box-shadow: inset 0 8px 18px rgba(0,0,0,0.6), 0 0 0 3px var(--accent);
    }

    .hole::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 10%;
      transform: translateX(-50%);
      width: 72%;
      height: 38%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, #000 0%, #262626 75%, transparent 100%);
      box-shadow: inset 0 6px 10px rgba(0,0,0,0.85);
      z-index: 1;
    }

    .hole-number {
      position: absolute;
      top: 4px; left: 6px;
      font-size: 0.62rem;
      color: rgba(255,255,255,0.25);
      z-index: 2;
    }

    .critter {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 100%);
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 3;
      filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5));
      pointer-events: none;
      user-select: none;
    }

    .hole.up .critter { transform: translate(-50%, -8%); }

    .hole.golden .critter {
      filter: drop-shadow(0 0 12px var(--gold)) drop-shadow(0 4px 5px rgba(0,0,0,0.5));
    }

    .hole.hit .critter { animation: critterHit 0.32s ease forwards; }

    .hole.flash-good { box-shadow: inset 0 8px 18px rgba(0,0,0,0.6), 0 0 0 3px var(--green), 0 0 20px rgba(0,255,136,0.4); }
    .hole.flash-bad { box-shadow: inset 0 8px 18px rgba(0,0,0,0.6), 0 0 0 3px var(--red), 0 0 20px rgba(255,68,68,0.4); }

    .score-popup {
      position: absolute;
      top: 6%;
      left: 50%;
      font-weight: bold;
      font-size: clamp(0.9rem, 4vw, 1.2rem);
      pointer-events: none;
      z-index: 5;
      animation: popFloat 0.7s ease forwards;
      text-shadow: 0 0 8px rgba(0,0,0,0.6);
    }

    .score-popup.good { color: var(--gold); }
    .score-popup.bad { color: var(--red); }

    .combo-banner {
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      font-weight: bold;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(255,215,0,0.6);
      pointer-events: none;
      z-index: 20;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      opacity: 0;
    }

    .combo-banner.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .controls-bar {
      position: fixed;
      bottom: calc(8px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      padding: 6px 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(22, 22, 46, 0.85);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(6px);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
      max-width: calc(100vw - 16px);
    }

    button {
      background: var(--accent2);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    button:hover {
      background: var(--accent);
      transform: scale(1.03);
      box-shadow: 0 0 12px rgba(0,242,255,0.25);
    }

    .modal {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(22, 22, 46, 0.98);
      padding: 20px 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,242,255,0.3);
      z-index: 15;
      border: 1px solid rgba(255,255,255,0.1);
      animation: popIn 0.45s ease;
      max-width: 90vw;
    }

    .modal h2 {
      font-size: clamp(1.2rem, 4.5vw, 1.5rem);
      background: linear-gradient(90deg, var(--gold), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .modal p { color: #999; font-size: 0.8rem; margin-bottom: 10px; }

    .win-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .win-stat {
      background: rgba(255,255,255,0.05);
      padding: 8px;
      border-radius: 8px;
    }

    .win-stat .num { font-size: 1.2rem; color: var(--accent); font-weight: bold; }
    .win-stat .lbl { font-size: 0.7rem; color: #888; }

    .new-best {
      color: var(--gold);
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 6px;
      display: none;
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 14;
    }

    @keyframes critterHit {
      0% { transform: translate(-50%, -8%) scale(1) rotate(0); }
      40% { transform: translate(-50%, -32%) scale(1.3) rotate(-12deg); }
      100% { transform: translate(-50%, 100%) scale(0.6) rotate(20deg); opacity: 0.4; }
    }

    @keyframes popFloat {
      0% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -46px); }
    }

    @keyframes shakeScreen {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 3px); }
      40% { transform: translate(6px, -3px); }
      60% { transform: translate(-4px, 2px); }
      80% { transform: translate(4px, -2px); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @media (max-height: 650px) {
      body { padding: 6px 6px calc(58px + env(safe-area-inset-bottom)) 6px; }
      h1 { font-size: 1.4rem; }
      .subtitle { display: none; }
      .stats { gap: 3px; margin-bottom: 5px; }
      .stat { padding: 3px 4px; }
      .stat span { font-size: 0.78rem; }
      .game-board { gap: 8px; width: var(--board-width, min(94vw, 340px)); }
      .controls-bar { bottom: calc(6px + env(safe-area-inset-bottom)); padding: 4px 8px; }
    }

    @media (max-width: 360px) {
      .stats { grid-template-columns: repeat(5, 1fr); }
      .stat span { font-size: 0.7rem; }
      .stat .label { font-size: 0.5rem; }
      .controls-bar button, .controls-bar a button { padding: 5px 7px; font-size: 0.6rem; }
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <canvas id="confetti-canvas"></canvas>

  <header>
    <h1>🔨 Whack-a-Mole</h1>
    <p class="subtitle">Whack moles, dodge bombs, grab the gold star!</p>
  </header>

  <div class="difficulty-bar" id="difficultyBar">
    <button data-diff="easy" onclick="setDifficulty('easy')">Easy</button>
    <button data-diff="medium" onclick="setDifficulty('medium')">Medium</button>
    <button data-diff="hard" onclick="setDifficulty('hard')">Hard</button>
  </div>

  <div class="stats">
    <div class="stat"><span id="score">0</span><span class="label">Score</span></div>
    <div class="stat"><span id="best">0</span><span class="label">Best</span></div>
    <div class="stat" id="timeStat"><span id="timeLeft">45</span><span class="label">Time</span></div>
    <div class="stat"><span id="combo">x1</span><span class="label">Combo</span></div>
    <div class="stat"><span id="accuracy">0%</span><span class="label">Accuracy</span></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="timeFill"></div>
    </div>
  </div>

  <div class="audio-controls">
    <button id="soundBtn" onclick="toggleSound()">🔊 Sound: On</button>
  </div>

  <div class="game-board" id="board" role="grid" aria-label="Whack-a-mole holes"></div>

  <div class="combo-banner" id="comboBanner">🔥 Combo x2!</div>

  <div class="controls-bar">
    <button onclick="startGame()">🔄 Restart</button>
    <a href="../../index.html" style="text-decoration:none;">
      <button type="button">🏠 Arcade Home</button>
    </a>
  </div>

  <div class="modal" id="startModal">
    <h2>🔨 Whack-a-Mole</h2>
    <p>Whack 🐹 for points, grab ⭐ for bonus time, avoid 💣!<br>Tap a hole, or use keys 1-9.</p>
    <button onclick="startGame()">▶ Start Game</button>
  </div>

  <div class="modal" id="endModal" style="display:none;">
    <h2>⏱ Time's Up!</h2>
    <p class="new-best" id="newBestTag">🏆 New Best Score!</p>
    <div class="win-stats">
      <div class="win-stat"><div class="num" id="finalScore">0</div><div class="lbl">Score</div></div>
      <div class="win-stat"><div class="num" id="finalHits">0</div><div class="lbl">Hits</div></div>
      <div class="win-stat"><div class="num" id="finalAccuracy">0%</div><div class="lbl">Accuracy</div></div>
      <div class="win-stat"><div class="num" id="finalBest">0</div><div class="lbl">Best</div></div>
    </div>
    <button onclick="startGame()">Play Again</button>
  </div>

  <script>
    const DIFFICULTIES = {
      easy:   { duration: 45, spawnMin: 700, spawnMax: 1200, upTime: 1400, goldenUpTime: 950,  bombChance: 0.12, goldenChance: 0.10 },
      medium: { duration: 35, spawnMin: 550, spawnMax: 950,  upTime: 1050, goldenUpTime: 750,  bombChance: 0.18, goldenChance: 0.12 },
      hard:   { duration: 25, spawnMin: 400, spawnMax: 700,  upTime: 750,  goldenUpTime: 550,  bombChance: 0.24, goldenChance: 0.14 }
    };

    const HOLE_COUNT = 9;
    const BONUS_TIME = 3;

    let currentDifficulty = 'easy';
    let holes = [];
    let holeState = [];
    let holeTimers = [];
    let score = 0;
    let combo = 0;
    let comboMultiplier = 1;
    let hits = 0;
    let clicks = 0;
    let timeLeft = 0;
    let roundDuration = 45;
    let gameRunning = false;
    let spawnTimeout = null;
    let countdownInterval = null;
    let soundEnabled = true;
    let audioCtx = null;

    const board = document.getElementById('board');
    const scoreDisplay = document.getElementById('score');
    const bestDisplay = document.getElementById('best');
    const timeDisplay = document.getElementById('timeLeft');
    const timeStat = document.getElementById('timeStat');
    const comboDisplay = document.getElementById('combo');
    const accuracyDisplay = document.getElementById('accuracy');
    const timeFill = document.getElementById('timeFill');
    const comboBanner = document.getElementById('comboBanner');
    const startModal = document.getElementById('startModal');
    const endModal = document.getElementById('endModal');
    const soundBtn = document.getElementById('soundBtn');

    // ---- Audio ----
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(frequency, type, duration, delay = 0, vol = 0.15) {
      if (!soundEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    function playWhackSound()   { playTone(220, 'square', 0.09, 0, 0.14); }
    function playGoldenSound()  { playTone(880, 'sine', 0.12); playTone(1175, 'sine', 0.15, 0.1); }
    function playBombSound()    { playTone(140, 'sawtooth', 0.3); playTone(90, 'sawtooth', 0.3, 0.08); }
    function playMissSound()    { playTone(160, 'triangle', 0.08, 0, 0.06); }
    function playTickSound()    { playTone(660, 'sine', 0.05, 0, 0.05); }
    function playComboSound(c)  { const base = 440 + c * 40; playTone(base, 'sine', 0.1); playTone(base * 1.25, 'sine', 0.12, 0.07); }
    function playGameOverSound(){ [523.25, 659.25, 783.99].forEach((f, i) => playTone(f, 'sine', 0.25, i * 0.12)); }
    function playBestSound()    { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => playTone(f, 'sine', 0.3, i * 0.13)); }

    function toggleSound() {
      initAudio();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound: On' : '🔇 Sound: Off';
    }

    // ---- Difficulty ----
    function setDifficulty(diff) {
      currentDifficulty = diff;
      document.querySelectorAll('#difficultyBar button').forEach(btn => btn.classList.toggle('active', btn.dataset.diff === diff));
      roundDuration = DIFFICULTIES[diff].duration;
      resetStatsUI();
    }

    function getBestScore() {
      return parseInt(localStorage.getItem(`whackBest_${currentDifficulty}`) || '0', 10);
    }

    function saveBestScore() {
      const best = getBestScore();
      if (score > best) {
        localStorage.setItem(`whackBest_${currentDifficulty}`, score);
        return true;
      }
      return false;
    }

    // ---- Board setup ----
    function buildBoard() {
      board.innerHTML = '';
      holes = [];
      for (let i = 0; i < HOLE_COUNT; i++) {
        const hole = document.createElement('div');
        hole.className = 'hole';
        hole.dataset.index = i;
        hole.setAttribute('role', 'button');
        hole.setAttribute('tabindex', '0');
        hole.setAttribute('aria-label', `Hole ${i + 1}, empty`);
        hole.innerHTML = `
          <span class="hole-number">${i + 1}</span>
          <span class="critter"></span>
        `;
        hole.addEventListener('pointerdown', (e) => { e.preventDefault(); whack(i); });
        hole.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); whack(i); }
        });
        board.appendChild(hole);
        holes.push(hole);
      }
    }

    function resetStatsUI() {
      score = 0;
      combo = 0;
      comboMultiplier = 1;
      hits = 0;
      clicks = 0;
      timeLeft = roundDuration;
      scoreDisplay.textContent = '0';
      bestDisplay.textContent = getBestScore();
      timeDisplay.textContent = timeLeft;
      comboDisplay.textContent = 'x1';
      accuracyDisplay.textContent = '0%';
      timeFill.style.width = '100%';
      timeFill.classList.remove('low');
      timeStat.classList.remove('low-time');
    }

    // ---- Game flow ----
    function startGame() {
      initAudio();
      clearTimeout(spawnTimeout);
      clearInterval(countdownInterval);
      holeTimers.forEach(t => clearTimeout(t));
      holeTimers = [];
      buildBoard();
      holeState = new Array(HOLE_COUNT).fill('empty');
      resetStatsUI();
      startModal.style.display = 'none';
      endModal.style.display = 'none';
      gameRunning = true;

      countdownInterval = setInterval(() => {
        timeLeft--;
        timeDisplay.textContent = Math.max(0, timeLeft);
        const pct = Math.max(0, (timeLeft / roundDuration) * 100);
        timeFill.style.width = `${pct}%`;
        if (timeLeft <= 5) {
          timeFill.classList.add('low');
          timeStat.classList.add('low-time');
          if (timeLeft > 0) playTickSound();
        }
        if (timeLeft <= 0) {
          endRound();
        }
      }, 1000);

      scheduleSpawn();
    }

    function scheduleSpawn() {
      if (!gameRunning) return;
      const cfg = DIFFICULTIES[currentDifficulty];
      const delay = cfg.spawnMin + Math.random() * (cfg.spawnMax - cfg.spawnMin);
      spawnTimeout = setTimeout(() => {
        spawnCritter();
        scheduleSpawn();
      }, delay);
    }

    function spawnCritter() {
      const emptyIdx = holeState.reduce((arr, s, i) => { if (s === 'empty') arr.push(i); return arr; }, []);
      if (!emptyIdx.length) return;
      const idx = emptyIdx[Math.floor(Math.random() * emptyIdx.length)];
      const cfg = DIFFICULTIES[currentDifficulty];

      const roll = Math.random();
      let type, upTime, icon;
      if (roll < cfg.bombChance) {
        type = 'bomb'; upTime = cfg.upTime; icon = '💣';
      } else if (roll < cfg.bombChance + cfg.goldenChance) {
        type = 'golden'; upTime = cfg.goldenUpTime; icon = '⭐';
      } else {
        type = 'mole'; upTime = cfg.upTime; icon = '🐹';
      }

      holeState[idx] = type;
      const hole = holes[idx];
      hole.querySelector('.critter').textContent = icon;
      hole.classList.add('up', type);
      hole.setAttribute('aria-label', `Hole ${idx + 1}, ${type}`);

      holeTimers[idx] = setTimeout(() => {
        if (holeState[idx] === type) {
          hideHole(idx);
        }
      }, upTime);
    }

    function hideHole(idx) {
      const hole = holes[idx];
      hole.classList.remove('up', 'mole', 'golden', 'bomb');
      holeState[idx] = 'empty';
      hole.setAttribute('aria-label', `Hole ${idx + 1}, empty`);
    }

    function whack(idx) {
      if (!gameRunning) return;
      const type = holeState[idx];
      const hole = holes[idx];
      clicks++;

      if (type === 'mole' || type === 'golden') {
        hits++;
        combo++;
        comboMultiplier = 1 + Math.floor(combo / 5) * 0.5;
        if (comboMultiplier > 3) comboMultiplier = 3;
        comboDisplay.textContent = `x${comboMultiplier.toFixed(1).replace('.0', '')}`;

        const base = type === 'golden' ? 40 : 10;
        const points = Math.round(base * comboMultiplier);
        score += points;
        scoreDisplay.textContent = score;
        bestDisplay.textContent = Math.max(score, getBestScore());

        clearTimeout(holeTimers[idx]);
        hole.classList.add('hit', 'flash-good');
        showPopup(hole, `+${points}`, 'good');

        if (type === 'golden') {
          playGoldenSound();
          timeLeft = Math.min(roundDuration, timeLeft + BONUS_TIME);
          timeDisplay.textContent = timeLeft;
          showPopup(hole, `+${BONUS_TIME}s`, 'good');
        } else {
          playWhackSound();
        }

        if (combo > 0 && combo % 5 === 0) {
          playComboSound(combo);
          showCombo(comboMultiplier);
        }

        setTimeout(() => {
          hole.classList.remove('hit', 'flash-good');
          hideHole(idx);
        }, 260);

      } else if (type === 'bomb') {
        combo = 0;
        comboMultiplier = 1;
        comboDisplay.textContent = 'x1';
        score = Math.max(0, score - 15);
        scoreDisplay.textContent = score;

        clearTimeout(holeTimers[idx]);
        hole.classList.add('hit', 'flash-bad');
        showPopup(hole, '-15', 'bad');
        playBombSound();
        shakeScreen();

        setTimeout(() => {
          hole.classList.remove('hit', 'flash-bad');
          hideHole(idx);
        }, 260);

      } else {
        combo = 0;
        comboMultiplier = 1;
        comboDisplay.textContent = 'x1';
        playMissSound();
        hole.classList.add('flash-bad');
        setTimeout(() => hole.classList.remove('flash-bad'), 200);
      }

      accuracyDisplay.textContent = clicks ? `${Math.round((hits / clicks) * 100)}%` : '0%';
    }

    function showPopup(hole, text, kind) {
      const popup = document.createElement('span');
      popup.className = `score-popup ${kind}`;
      popup.textContent = text;
      hole.appendChild(popup);
      setTimeout(() => popup.remove(), 700);
    }

    function showCombo(multiplier) {
      comboBanner.textContent = `🔥 Combo x${multiplier.toFixed(1).replace('.0', '')}!`;
      comboBanner.classList.add('show');
      setTimeout(() => comboBanner.classList.remove('show'), 900);
    }

    function shakeScreen() {
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 350);
    }

    function endRound() {
      gameRunning = false;
      clearTimeout(spawnTimeout);
      clearInterval(countdownInterval);
      holeTimers.forEach(t => clearTimeout(t));
      holes.forEach((hole, i) => {
        hole.classList.remove('up', 'mole', 'golden', 'bomb');
        holeState[i] = 'empty';
      });

      const isNewBest = saveBestScore();
      playGameOverSound();

      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalHits').textContent = hits;
      document.getElementById('finalAccuracy').textContent = clicks ? `${Math.round((hits / clicks) * 100)}%` : '0%';
      document.getElementById('finalBest').textContent = getBestScore();
      document.getElementById('newBestTag').style.display = isNewBest ? 'block' : 'none';

      if (isNewBest) {
        setTimeout(() => playBestSound(), 300);
        launchConfetti();
      }

      endModal.style.display = 'block';
    }

    // ---- Confetti (celebration for new best) ----
    const confettiCanvas = document.getElementById('confetti-canvas');
    const cctx = confettiCanvas.getContext('2d');
    let particles = [];
    let confettiReq;

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function launchConfetti() {
      const colors = ['#00f2ff', '#ff00aa', '#ffd700', '#00ff88', '#ff4444', '#ffffff'];
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      for (let i = 0; i < 140; i++) {
        particles.push({
          x: cx, y: cy,
          vx: (Math.random() - 0.5) * 18,
          vy: (Math.random() - 1.2) * 16,
          size: Math.random() * 8 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.3,
          gravity: 0.3,
          drag: 0.96,
          life: 1
        });
      }
      if (!confettiReq) animateConfetti();
    }

    function animateConfetti() {
      cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.rotation += p.rotationSpeed;
        p.life -= 0.015;

        cctx.save();
        cctx.translate(p.x, p.y);
        cctx.rotate(p.rotation);
        cctx.globalAlpha = Math.max(0, p.life);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        cctx.restore();

        if (p.life <= 0) particles.splice(i, 1);
      });

      if (particles.length > 0) {
        confettiReq = requestAnimationFrame(animateConfetti);
      } else {
        confettiReq = null;
        cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    // ---- Keyboard shortcut: 1-9 for holes ----
    document.addEventListener('keydown', (e) => {
      if (!gameRunning) return;
      const active = document.activeElement;
      if (active && (active.tagName === 'BUTTON' || active.tagName === 'A')) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= HOLE_COUNT) {
        e.preventDefault();
        whack(num - 1);
      }
    });

    // ---- Init ----
    try {
      buildBoard();
      setDifficulty('easy');
    } catch (err) {
      console.error('Whack-a-Mole init failed:', err);
      board.innerHTML = '<div style="color:#ff6b6b;text-align:center;padding:20px;">Game failed to load. Please refresh.</div>';
    }
  </script>
</body>
