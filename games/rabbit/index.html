<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🐰 Neon Bunny Hop</title>
  <style>
    :root {
      --bg: #0d0d1a;
      --panel: #16162e;
      --accent: #00f2ff;
      --accent2: #ff00aa;
      --gold: #ffd700;
      --lime: #7CFC00;
      --text: #f5f5f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    header { text-align: center; margin-bottom: 12px; }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0,242,255,0.5);
    }

    .stats {
      display: flex;
      gap: 14px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat {
      background: var(--panel);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .stat span { color: var(--gold); font-weight: bold; }

    .stat.combo span { color: var(--accent2); }
    .stat.combo { opacity: 0.4; transition: opacity 0.2s, transform 0.2s; }
    .stat.combo.active { opacity: 1; transform: scale(1.08); }

    .game-wrapper {
      position: relative;
      border: 2px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,242,255,0.2);
      background: #050510;
      max-width: 100%;
      transition: transform 0.05s linear;
    }

    .game-wrapper.shake { animation: shake 0.35s ease; }
    .game-wrapper.turbo { box-shadow: 0 0 40px rgba(255,215,0,0.5); }

    @keyframes shake {
      0%, 100% { transform: translate(0,0); }
      20% { transform: translate(-6px, 4px); }
      40% { transform: translate(6px, -4px); }
      60% { transform: translate(-4px, -3px); }
      80% { transform: translate(4px, 3px); }
    }

    canvas {
      display: block;
      border-radius: 10px;
      max-width: 100%;
      height: auto;
      cursor: pointer;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(13,13,26,0.92);
      border-radius: 10px;
      text-align: center;
      padding: 20px;
      z-index: 2;
    }

    .overlay h2 {
      font-size: 1.7rem;
      color: var(--accent2);
      margin-bottom: 10px;
    }

    .overlay p { margin-bottom: 8px; color: #ccc; font-size: 0.92rem; }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: var(--accent2);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover { background: var(--accent); transform: scale(1.05); }

    .jump-btn {
      display: none;
      margin-top: 18px;
      width: 100%;
      max-width: 400px;
      padding: 18px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      background: var(--panel);
      border: 2px solid var(--accent);
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.3rem; }
      .jump-btn { display: block; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🐰 Neon Bunny Hop</h1>
  </header>

  <div class="stats">
    <div class="stat">Score: <span id="score">0</span></div>
    <div class="stat">High: <span id="highScore">0</span></div>
    <div class="stat combo" id="comboStat">Combo: <span id="combo">x1</span></div>
    <div class="stat">Speed: <span id="speedMult">1.0x</span></div>
  </div>

  <div class="game-wrapper" id="gameWrapper">
    <canvas id="gameCanvas" width="640" height="320"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">🐰 Neon Bunny Hop</h2>
      <p id="overlayText">Tap, click, or press Space to jump — tap again mid-air for a double jump.<br>Chain carrots fast for combo multipliers. Grab the gold carrot for Turbo mode.</p>
      <p id="overlayScore"></p>
      <button id="startBtn" onclick="handleOverlayAction()">Start Run</button>
    </div>
  </div>

  <button class="jump-btn" id="mobileJumpBtn" onclick="queueJump()">⇧ JUMP</button>

  <div class="controls">
    <button onclick="restartGame()">Restart</button>
    <button onclick="togglePause()">Pause</button>
    <a href="../../index.html" style="text-decoration:none;">
      <button type="button">🏠 Arcade Home</button>
    </a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameWrapper = document.getElementById('gameWrapper');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const overlayScore = document.getElementById('overlayScore');
    const startBtn = document.getElementById('startBtn');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const comboEl = document.getElementById('combo');
    const comboStat = document.getElementById('comboStat');
    const speedMultEl = document.getElementById('speedMult');

    const W = canvas.width, H = canvas.height;
    const GROUND_Y = H - 40;
    const RABBIT_X = 100;
    const RABBIT_W = 34, RABBIT_H = 40;
    const GRAVITY = 0.85;
    const JUMP_V = -13.5;
    const DOUBLE_JUMP_V = -11;
    const FASTFALL_MULT = 2.1;
    const BASE_SPEED = 4.6;
    const MAX_SPEED = 11.5;
    const SPEED_RAMP_MS = 3500;
    const SPEED_RAMP_FACTOR = 1.06;
    const BASE_SPAWN_MS = 1250;
    const MIN_SPAWN_MS = 650;
    const CARROT_SPAWN_MS = 900;
    const COMBO_WINDOW_MS = 1700;
    const TURBO_DURATION_MS = 3200;
    const MAX_COMBO = 8;

    let rabbit, obstacles, carrots, trail, particles;
    let scrollSpeed, obsTimer, carrotTimer, rampTimer, distance, score;
    let combo = 0, comboTimer = 0;
    let turboLeft = 0;
    let downHeld = false;
    let highScore = parseInt(localStorage.getItem('neonBunnyHighScore') || '0', 10);
    let running = false, paused = false;
    let lastTime = 0;

    highScoreEl.textContent = highScore;

    // ---- Audio ----
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, type, duration, delay = 0, vol = 0.09) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }
    const sfx = {
      jump: () => playTone(480, 'square', 0.07, 0, 0.06),
      doubleJump: () => { playTone(560, 'square', 0.06, 0, 0.06); playTone(760, 'square', 0.07, 0.05, 0.05); },
      carrot: (c) => playTone(700 + c * 60, 'sine', 0.09, 0, 0.06),
      turbo: () => { [500, 700, 900, 1200].forEach((f, i) => playTone(f, 'sine', 0.12, i * 0.06, 0.07)); },
      crash: () => { playTone(160, 'sawtooth', 0.3); playTone(90, 'sawtooth', 0.4, 0.12); }
    };

    function resetGame() {
      rabbit = { y: GROUND_Y - RABBIT_H, vy: 0, jumpsUsed: 0, grounded: true, squash: 0, earFlick: 0 };
      obstacles = [];
      carrots = [];
      trail = [];
      particles = [];
      scrollSpeed = BASE_SPEED;
      obsTimer = BASE_SPAWN_MS;
      carrotTimer = CARROT_SPAWN_MS * 0.6;
      rampTimer = 0;
      distance = 0;
      score = 0;
      combo = 0;
      comboTimer = 0;
      turboLeft = 0;
      downHeld = false;
      scoreEl.textContent = 0;
      comboEl.textContent = 'x1';
      comboStat.classList.remove('active');
      speedMultEl.textContent = '1.0x';
      gameWrapper.classList.remove('turbo');
    }

    function startGame() {
      initAudio();
      resetGame();
      overlay.style.display = 'none';
      running = true;
      paused = false;
    }

    function restartGame() { startGame(); }

    let overlayAction = () => startGame();
    function handleOverlayAction() { overlayAction(); }

    function togglePause() {
      if (!running) { overlayAction(); return; }
      paused = !paused;
      if (paused) {
        overlayTitle.textContent = '⏸ Paused';
        overlayText.textContent = 'Press Resume to continue.';
        overlayScore.textContent = '';
        startBtn.textContent = 'Resume';
        overlayAction = () => { paused = false; overlay.style.display = 'none'; };
        overlay.style.display = 'flex';
      } else {
        overlay.style.display = 'none';
      }
    }

    function queueJump() {
      if (!running) { startGame(); return; }
      if (paused) return;
      if (rabbit.jumpsUsed === 0) {
        rabbit.vy = JUMP_V;
        rabbit.jumpsUsed = 1;
        rabbit.grounded = false;
        rabbit.squash = 6;
        sfx.jump();
        burst(RABBIT_X, GROUND_Y, '#00f2ff', 6);
      } else if (rabbit.jumpsUsed === 1) {
        rabbit.vy = DOUBLE_JUMP_V;
        rabbit.jumpsUsed = 2;
        rabbit.earFlick = 1;
        sfx.doubleJump();
        burst(RABBIT_X, rabbit.y + RABBIT_H / 2, '#ff00aa', 10);
      }
    }

    function burst(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.8) * 4,
          life: 22, color
        });
      }
    }

    // ---- Input ----
    document.addEventListener('keydown', e => {
      initAudio();
      if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        e.preventDefault();
        queueJump();
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        downHeld = true;
      } else if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
        togglePause();
      }
    });
    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') downHeld = false;
    });

    canvas.addEventListener('pointerdown', () => { initAudio(); queueJump(); });

    function spawnObstacle() {
      const r = Math.random();
      if (r < 0.4) {
        obstacles.push({ x: W + 10, w: 30, h: 34, type: 'rock' });
      } else if (r < 0.75) {
        obstacles.push({ x: W + 10, w: 34, h: 48, type: 'fox' });
      } else {
        obstacles.push({ x: W + 10, w: 26, h: 34, type: 'rock' });
        obstacles.push({ x: W + 10 + 70 + Math.random() * 20, w: 30, h: 46, type: 'fox' });
      }
    }

    function spawnCarrot() {
      const turbo = score > 150 && Math.random() < 0.1;
      const groundLevel = Math.random() < 0.4;
      const y = turbo
        ? GROUND_Y - 90 - Math.random() * 30
        : (groundLevel ? GROUND_Y - 22 : GROUND_Y - 70 - Math.random() * 60);
      carrots.push({ x: W + 10, y, w: turbo ? 26 : 20, h: turbo ? 26 : 20, turbo, collected: false });
    }

    function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function update(dt) {
      const dtF = Math.min(dt / 16.67, 3);

      // rabbit physics
      const g = downHeld && !rabbit.grounded ? GRAVITY * FASTFALL_MULT : GRAVITY;
      rabbit.vy += g * dtF;
      rabbit.y += rabbit.vy * dtF;
      const restY = GROUND_Y - RABBIT_H;
      if (rabbit.y >= restY) {
        if (!rabbit.grounded && rabbit.vy > 4) { rabbit.squash = 8; burst(RABBIT_X, GROUND_Y, 'rgba(255,255,255,0.5)', 4); }
        rabbit.y = restY; rabbit.vy = 0; rabbit.grounded = true; rabbit.jumpsUsed = 0;
      } else {
        rabbit.grounded = false;
      }
      rabbit.squash = Math.max(0, rabbit.squash - dtF);
      rabbit.earFlick = Math.max(0, rabbit.earFlick - dtF * 0.05);

      trail.push({ x: RABBIT_X, y: rabbit.y + RABBIT_H / 2, turbo: turboLeft > 0 });
      if (trail.length > 12) trail.shift();

      // turbo timer
      if (turboLeft > 0) {
        turboLeft -= dt;
        if (turboLeft <= 0) { turboLeft = 0; gameWrapper.classList.remove('turbo'); }
      }

      // combo decay
      if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0) { combo = 0; comboEl.textContent = 'x1'; comboStat.classList.remove('active'); }
      }

      // speed ramp
      rampTimer += dt;
      if (rampTimer >= SPEED_RAMP_MS) {
        rampTimer = 0;
        scrollSpeed = Math.min(scrollSpeed * SPEED_RAMP_FACTOR, MAX_SPEED);
        speedMultEl.textContent = (scrollSpeed / BASE_SPEED).toFixed(1) + 'x';
      }
      const effSpeed = scrollSpeed * (turboLeft > 0 ? 1.35 : 1);

      distance += effSpeed * dtF;
      score = Math.floor(distance / 8);
      scoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        localStorage.setItem('neonBunnyHighScore', highScore);
      }

      // spawn obstacles
      obsTimer -= dt;
      if (obsTimer <= 0) {
        spawnObstacle();
        const interval = Math.max(MIN_SPAWN_MS, BASE_SPAWN_MS - score * 1.2);
        obsTimer = interval + Math.random() * interval * 0.3;
      }
      carrotTimer -= dt;
      if (carrotTimer <= 0) {
        spawnCarrot();
        carrotTimer = CARROT_SPAWN_MS + Math.random() * 400;
      }

      // move + collide obstacles
      for (const o of obstacles) {
        o.x -= effSpeed * dtF;
        const oy = GROUND_Y - o.h;
        if (rectsOverlap(RABBIT_X - RABBIT_W / 2 + 5, rabbit.y + 4, RABBIT_W - 10, RABBIT_H - 8, o.x, oy, o.w, o.h)) {
          if (turboLeft > 0) {
            burst(o.x + o.w / 2, oy + o.h / 2, '#ffd700', 10);
            o.x = -9999;
            score += 15;
          } else {
            gameOver();
            return;
          }
        }
      }
      obstacles = obstacles.filter(o => o.x + o.w > -10);

      // move + collide carrots
      for (const c of carrots) {
        if (c.collected) continue;
        c.x -= effSpeed * dtF;
        if (rectsOverlap(RABBIT_X - RABBIT_W / 2, rabbit.y, RABBIT_W, RABBIT_H, c.x, c.y, c.w, c.h)) {
          c.collected = true;
          if (c.turbo) {
            turboLeft = TURBO_DURATION_MS;
            gameWrapper.classList.add('turbo');
            score += 60;
            sfx.turbo();
            burst(c.x, c.y, '#ffd700', 16);
          } else {
            combo = Math.min(combo + 1, MAX_COMBO);
            comboTimer = COMBO_WINDOW_MS;
            comboEl.textContent = 'x' + (1 + combo);
            comboStat.classList.add('active');
            score += 10 * (1 + combo);
            sfx.carrot(combo);
            burst(c.x, c.y, '#ff8c00', 6);
          }
        }
      }
      carrots = carrots.filter(c => !c.collected && c.x + c.w > -10);

      particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
      particles = particles.filter(p => p.life > 0);
    }

    function gameOver() {
      running = false;
      sfx.crash();
      gameWrapper.classList.add('shake');
      gameWrapper.classList.remove('turbo');
      setTimeout(() => gameWrapper.classList.remove('shake'), 350);
      const isHigh = score >= highScore && score > 0;
      overlayTitle.textContent = '🥕 Oops!';
      overlayText.textContent = `Final Score: ${score} — Best Combo: x${1 + combo}`;
      overlayScore.textContent = isHigh ? '🎉 New High Score!' : `High Score: ${highScore}`;
      startBtn.textContent = 'Hop Again';
      overlayAction = () => startGame();
      overlay.style.display = 'flex';
    }

    // ---- Rendering ----
    function render() {
      ctx.fillStyle = '#050510';
      ctx.fillRect(0, 0, W, H);

      // synthwave sun
      const sunY = 70;
      const grad = ctx.createLinearGradient(0, sunY - 45, 0, sunY + 45);
      grad.addColorStop(0, '#ff00aa');
      grad.addColorStop(1, '#00f2ff');
      ctx.fillStyle = grad;
      ctx.globalAlpha = 0.25;
      ctx.beginPath();
      ctx.arc(W - 110, sunY, 45, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // scrolling parallax grid (sky)
      ctx.strokeStyle = 'rgba(0,242,255,0.05)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      const offset = running ? -(distance % gridSize) : 0;
      for (let x = offset; x < W; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GROUND_Y); ctx.stroke();
      }

      // ground
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00f2ff';
      ctx.strokeStyle = '#00f2ff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(0,242,255,0.06)';
      ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
      const groundOffset2 = running ? -(distance % 30) : 0;
      ctx.strokeStyle = 'rgba(0,242,255,0.15)';
      ctx.lineWidth = 1;
      for (let x = groundOffset2; x < W; x += 30) {
        ctx.beginPath(); ctx.moveTo(x, GROUND_Y); ctx.lineTo(x - 10, H); ctx.stroke();
      }

      drawCarrots();
      drawObstacles();
      drawTrail();
      drawParticles();
      drawRabbit();
    }

    function drawObstacles() {
      obstacles.forEach(o => {
        const oy = GROUND_Y - o.h;
        ctx.shadowBlur = 10;
        if (o.type === 'rock') {
          ctx.shadowColor = '#9b30ff';
          ctx.fillStyle = '#9b30ff';
          ctx.beginPath();
          ctx.moveTo(o.x, GROUND_Y);
          ctx.lineTo(o.x + o.w * 0.2, oy + o.h * 0.3);
          ctx.lineTo(o.x + o.w * 0.5, oy);
          ctx.lineTo(o.x + o.w * 0.8, oy + o.h * 0.35);
          ctx.lineTo(o.x + o.w, GROUND_Y);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.shadowColor = '#ff00aa';
          ctx.fillStyle = '#ff00aa';
          ctx.beginPath();
          ctx.ellipse(o.x + o.w / 2, oy + o.h / 2, o.w / 2, o.h / 2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#050510';
          ctx.beginPath();
          ctx.moveTo(o.x + o.w * 0.15, oy + o.h * 0.1);
          ctx.lineTo(o.x + o.w * 0.05, oy - o.h * 0.25);
          ctx.lineTo(o.x + o.w * 0.4, oy + o.h * 0.15);
          ctx.moveTo(o.x + o.w * 0.85, oy + o.h * 0.1);
          ctx.lineTo(o.x + o.w * 0.95, oy - o.h * 0.25);
          ctx.lineTo(o.x + o.w * 0.6, oy + o.h * 0.15);
          ctx.fill();
          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.arc(o.x + o.w * 0.35, oy + o.h * 0.45, 2.5, 0, Math.PI * 2);
          ctx.arc(o.x + o.w * 0.65, oy + o.h * 0.45, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      });
    }

    function drawCarrots() {
      carrots.forEach(c => {
        if (c.collected) return;
        const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
        ctx.save();
        ctx.translate(cx, cy);
        const pulse = c.turbo ? 1 + Math.sin(distance * 0.05) * 0.15 : 1;
        ctx.scale(pulse, pulse);
        ctx.shadowBlur = c.turbo ? 18 : 8;
        ctx.shadowColor = c.turbo ? '#ffd700' : '#ff8c00';
        ctx.fillStyle = c.turbo ? '#ffd700' : '#ff8c00';
        ctx.beginPath();
        ctx.moveTo(0, c.h / 2);
        ctx.quadraticCurveTo(c.w / 2.5, -c.h * 0.1, 0, -c.h / 2);
        ctx.quadraticCurveTo(-c.w / 2.5, -c.h * 0.1, 0, c.h / 2);
        ctx.fill();
        ctx.fillStyle = '#7CFC00';
        ctx.beginPath();
        ctx.ellipse(-c.w * 0.15, -c.h / 2, c.w * 0.14, c.h * 0.22, -0.5, 0, Math.PI * 2);
        ctx.ellipse(c.w * 0.15, -c.h / 2, c.w * 0.14, c.h * 0.22, 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      });
    }

    function drawTrail() {
      trail.forEach((t, i) => {
        const alpha = (i / trail.length) * 0.3;
        ctx.fillStyle = t.turbo ? `rgba(255,215,0,${alpha})` : `rgba(255,255,255,${alpha * 0.6})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, (RABBIT_H / 2) * (i / trail.length) * 0.7, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 22);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function drawRabbit() {
      const cx = RABBIT_X, cy = rabbit.y + RABBIT_H / 2;
      const squashY = 1 - Math.min(rabbit.squash / 20, 0.35);
      const squashX = 1 + Math.min(rabbit.squash / 20, 0.35) * 0.6;
      const color = turboLeft > 0 ? '#ffd700' : '#f5f5f5';
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(squashX, squashY);
      ctx.shadowBlur = turboLeft > 0 ? 20 : 12;
      ctx.shadowColor = color;

      // ears
      const earLean = rabbit.earFlick * 0.4 + (!rabbit.grounded ? -0.15 : 0);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(-8, -RABBIT_H / 2 - 6, 5, 16, -0.2 - earLean, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(8, -RABBIT_H / 2 - 6, 5, 16, 0.2 + earLean, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff00aa';
      ctx.beginPath();
      ctx.ellipse(-8, -RABBIT_H / 2 - 6, 2.2, 10, -0.2 - earLean, 0, Math.PI * 2);
      ctx.ellipse(8, -RABBIT_H / 2 - 6, 2.2, 10, 0.2 + earLean, 0, Math.PI * 2);
      ctx.fill();

      // body
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(0, 0, RABBIT_W / 2, RABBIT_H / 2.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // eye
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0d0d1a';
      ctx.beginPath();
      ctx.arc(6, -4, 3, 0, Math.PI * 2);
      ctx.fill();

      // nose
      ctx.fillStyle = '#ff00aa';
      ctx.beginPath();
      ctx.arc(RABBIT_W / 2 - 2, 0, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop(timestamp) {
      const dt = lastTime ? timestamp - lastTime : 16.67;
      lastTime = timestamp;
      if (running && !paused) update(Math.min(dt, 40));
      render();
      requestAnimationFrame(loop);
    }

    // ---- Init ----
    resetGame();
    render();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
