<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🚀 Space Shooter | Mini Arcade</title>
  <style>
    :root {
      --bg: #050510;
      --panel: #0f0f24;
      --accent: #00f2ff;
      --accent2: #ff00aa;
      --gold: #ffd700;
      --red: #ff2a2a;
      --green: #00ff88;
      --text: #f5f5f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      max-width: 600px;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      display: block;
      z-index: 1;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 14px;
      gap: 10px;
      pointer-events: auto;
      flex-shrink: 0;
    }

    .hud-panel {
      background: rgba(15, 15, 36, 0.75);
      border: 1px solid rgba(0, 242, 255, 0.25);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.78rem;
      min-width: 70px;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .hud-panel span {
      display: block;
      font-size: 0.65rem;
      color: #888;
      margin-bottom: 1px;
    }

    .hud-panel strong {
      color: var(--accent);
      font-size: 1rem;
    }

    .health-bar {
      flex: 1;
      min-width: 80px;
      background: rgba(15, 15, 36, 0.75);
      border: 1px solid rgba(0, 242, 255, 0.25);
      border-radius: 10px;
      padding: 6px 10px;
      backdrop-filter: blur(4px);
    }

    .health-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--red), var(--gold), var(--green));
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .controls-bar {
      position: absolute;
      bottom: calc(10px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 8px;
      pointer-events: auto;
      background: rgba(15, 15, 36, 0.9);
      border: 1px solid rgba(0, 242, 255, 0.25);
      border-radius: 12px;
      padding: 8px 12px;
      backdrop-filter: blur(6px);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
    }

    button {
      background: var(--accent2);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      white-space: nowrap;
    }

    button:hover, button:active {
      background: var(--accent);
      transform: scale(1.05);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      height: 100%;
      background: rgba(5, 5, 16, 0.92);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      pointer-events: auto;
    }

    .overlay h1 {
      font-size: clamp(1.8rem, 7vw, 2.8rem);
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
      margin-bottom: 10px;
    }

    .overlay p {
      color: #aaa;
      font-size: 0.95rem;
      margin-bottom: 6px;
      max-width: 320px;
    }

    .overlay .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 20px 0;
      width: 100%;
      max-width: 280px;
    }

    .overlay .stat {
      background: rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: 10px;
    }

    .overlay .stat .num { font-size: 1.3rem; color: var(--accent); font-weight: bold; }
    .overlay .stat .lbl { font-size: 0.7rem; color: #888; }

    .overlay button {
      padding: 12px 28px;
      font-size: 1rem;
      margin-top: 10px;
    }

    .hidden { display: none !important; }

    .mobile-hint {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 0.7rem;
      text-align: center;
      z-index: 5;
      pointer-events: none;
      width: 100%;
      max-width: 600px;
    }

    .level-up {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      font-weight: bold;
      color: var(--gold);
      text-shadow: 0 0 25px rgba(255,215,0,0.6);
      z-index: 15;
      pointer-events: none;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
      opacity: 0;
    }

    .level-up.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <div class="hud" id="hud">
      <div class="hud-panel">
        <span>Score</span>
        <strong id="scoreEl">0</strong>
      </div>
      <div class="health-bar">
        <span>Health</span>
        <div class="health-track">
          <div class="health-fill" id="healthFill"></div>
        </div>
      </div>
      <div class="hud-panel">
        <span>Level</span>
        <strong id="levelEl">1</strong>
      </div>
      <div class="hud-panel">
        <span>Best</span>
        <strong id="bestEl">0</strong>
      </div>
    </div>
  </div>

  <div class="level-up" id="levelUp">LEVEL UP!</div>

  <div class="mobile-hint" id="mobileHint">Drag to move • Auto-fire enabled</div>

  <div class="controls-bar" id="controlsBar">
    <button id="startBtn" onclick="startGame()">Start</button>
    <button id="pauseBtn" onclick="togglePause()">Pause</button>
    <a href="../../index.html" style="text-decoration:none;">
      <button type="button">🏠 Home</button>
    </a>
  </div>

  <div class="overlay" id="startOverlay">
    <h1>🚀 Space Shooter</h1>
    <p>Defend Earth from the alien invasion!</p>
    <p>Drag or use arrows to move. Your ship fires automatically.</p>
    <button onclick="startGame()">Launch Mission</button>
  </div>

  <div class="overlay hidden" id="gameOverOverlay">
    <h1>💥 Mission Failed</h1>
    <div class="stats">
      <div class="stat">
        <div class="num" id="finalScore">0</div>
        <div class="lbl">Score</div>
      </div>
      <div class="stat">
        <div class="num" id="finalLevel">0</div>
        <div class="lbl">Level</div>
      </div>
      <div class="stat">
        <div class="num" id="finalBest">0</div>
        <div class="lbl">Best</div>
      </div>
      <div class="stat">
        <div class="num" id="finalKills">0</div>
        <div class="lbl">Kills</div>
      </div>
    </div>
    <button onclick="startGame()">Try Again</button>
    <a href="../../index.html" style="text-decoration:none;">
      <button type="button">🏠 Arcade Home</button>
    </a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const levelEl = document.getElementById('levelEl');
    const bestEl = document.getElementById('bestEl');
    const healthFill = document.getElementById('healthFill');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScore = document.getElementById('finalScore');
    const finalLevel = document.getElementById('finalLevel');
    const finalBest = document.getElementById('finalBest');
    const finalKills = document.getElementById('finalKills');
    const levelUpBanner = document.getElementById('levelUp');
    const mobileHint = document.getElementById('mobileHint');

    // Game state
    let gameRunning = false;
    let gamePaused = false;
    let lastTime = 0;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('shooterBest') || '0', 10);
    let level = 1;
    let kills = 0;
    let enemySpawnTimer = 0;
    let starSpawnTimer = 0;
    let particles = [];
    let stars = [];
    let bullets = [];
    let enemies = [];
    let powerUps = [];
    let enemySpeedBase = 80;
    let enemySpawnRate = 1.2;
    let animationId;

    bestEl.textContent = bestScore;

    // Audio
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol = 0.1) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playShootSound() { playTone(880, 'square', 0.06, 0.04); }
    function playExplosionSound() {
      playTone(120, 'sawtooth', 0.25, 0.12);
      playTone(60, 'sawtooth', 0.35, 0.18, 0.15);
    }
    function playPowerUpSound() {
      playTone(523, 'sine', 0.1);
      playTone(659, 'sine', 0.12, 0.08);
      playTone(880, 'sine', 0.15, 0.16);
    }
    function playDamageSound() { playTone(200, 'sawtooth', 0.15, 0.1); }
    function playGameOverSound() {
      playTone(440, 'sawtooth', 0.2);
      playTone(330, 'sawtooth', 0.25, 0.15);
      playTone(220, 'sawtooth', 0.35, 0.3);
    }
    function playLevelUpSound() {
      playTone(523, 'sine', 0.12);
      playTone(659, 'sine', 0.12, 0.1);
      playTone(784, 'sine', 0.12, 0.2);
      playTone(1047, 'sine', 0.25, 0.3);
    }

    // Player
    const player = {
      x: 0, y: 0,
      width: 44, height: 44,
      maxSpeed: 320,
      accel: 2600,
      decel: 2600,
      velocityX: 0,
      maxHealth: 100,
      health: 100,
      fireRate: 0.35,
      fireTimer: 0,
      color: '#00f2ff',
      engineTimer: 0
    };

    // Input
    const keys = {};
    let touchX = null;
    let touchY = null;
    let mouseDown = false;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      player.y = rect.height - 80;
      if (!gameRunning) player.x = rect.width / 2;
    }
    window.addEventListener('resize', resizeCanvas);

    // Input listeners
    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Escape') {
        e.preventDefault();
        if (gameRunning) togglePause();
        else startGame();
      }
      initAudio();
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
      initAudio();
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length > 0) {
        touchX = e.touches[0].clientX;
        touchY = e.touches[0].clientY;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      touchX = null;
      touchY = null;
    }, { passive: false });

    canvas.addEventListener('mousedown', e => { initAudio(); mouseDown = true; touchX = e.clientX - canvas.getBoundingClientRect().left; touchY = e.clientY - canvas.getBoundingClientRect().top; });
    document.addEventListener('mouseup', () => { mouseDown = false; touchX = null; touchY = null; });
    canvas.addEventListener('mousemove', e => {
      if (!mouseDown) return;
      const rect = canvas.getBoundingClientRect();
      touchX = e.clientX - rect.left;
      touchY = e.clientY - rect.top;
    });

    // Entities
    function spawnBullet() {
      bullets.push({
        x: player.x,
        y: player.y - 20,
        width: 4,
        height: 16,
        speed: 500,
        color: '#00f2ff'
      });
      playShootSound();
    }

    function spawnEnemy() {
      const rect = canvas.getBoundingClientRect();
      const type = Math.random();
      let enemy;
      if (type < 0.15) {
        // Tank enemy
        enemy = {
          x: Math.random() * (rect.width - 50) + 25,
          y: -40,
          width: 38, height: 38,
          speed: enemySpeedBase * 0.6,
          hp: 3,
          maxHp: 3,
          score: 30,
          color: '#ff4444',
          shape: 'tank'
        };
      } else if (type < 0.35) {
        // Fast enemy
        enemy = {
          x: Math.random() * (rect.width - 36) + 18,
          y: -30,
          width: 28, height: 28,
          speed: enemySpeedBase * 1.4,
          hp: 1,
          maxHp: 1,
          score: 15,
          color: '#ffd700',
          shape: 'fast'
        };
      } else {
        // Normal enemy
        enemy = {
          x: Math.random() * (rect.width - 40) + 20,
          y: -35,
          width: 32, height: 32,
          speed: enemySpeedBase,
          hp: 1,
          maxHp: 1,
          score: 10,
          color: '#ff00aa',
          shape: 'normal'
        };
      }
      enemies.push(enemy);
    }

    function spawnPowerUp(x, y) {
      if (Math.random() < 0.12) {
        const types = ['health', 'rapid', 'shield'];
        const type = types[Math.floor(Math.random() * types.length)];
        powerUps.push({ x, y, width: 22, height: 22, type, speed: 80 });
      }
    }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 220,
          vy: (Math.random() - 0.5) * 220,
          life: 0.6 + Math.random() * 0.5,
          size: 2 + Math.random() * 4,
          color
        });
      }
    }

    function spawnStars() {
      const rect = canvas.getBoundingClientRect();
      stars.push({
        x: Math.random() * rect.width,
        y: -2,
        size: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 60 + 30,
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    // Update functions
    function updatePlayer(dt) {
      const rect = canvas.getBoundingClientRect();
      let targetX = player.x;

      // Keyboard: use acceleration for smooth start/stop
      let inputX = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) inputX = -1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) inputX = 1;

      if (inputX !== 0) {
        // Apply extra force when reversing direction for snappy feel
        const reversing = (inputX > 0 && player.velocityX < 0) || (inputX < 0 && player.velocityX > 0);
        player.velocityX += inputX * player.accel * (reversing ? 2.2 : 1.0) * dt;
      } else {
        // Decelerate when no key pressed
        if (player.velocityX > 0) {
          player.velocityX = Math.max(0, player.velocityX - player.decel * dt);
        } else if (player.velocityX < 0) {
          player.velocityX = Math.min(0, player.velocityX + player.decel * dt);
        }
      }

      // Clamp to max speed
      player.velocityX = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.velocityX));

      // Touch/mouse drag follow (only active when touching or mouse button held)
      if (touchX !== null) {
        const targetX = touchX - rect.left;
        const diff = targetX - player.x;
        // Velocity proportional to distance — smooth but responsive
        player.velocityX = diff * 10;
      }

      // Apply velocity
      player.x += player.velocityX * dt;

      // Clamp
      player.x = Math.max(player.width/2, Math.min(rect.width - player.width/2, player.x));

      // Firing
      player.fireTimer -= dt;
      if (player.fireTimer <= 0) {
        spawnBullet();
        player.fireTimer = player.fireRate;
      }

      player.engineTimer += dt * 20;
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= b.speed * dt;
        if (b.y < -20) bullets.splice(i, 1);
      }
    }

    function updateEnemies(dt) {
      const rect = canvas.getBoundingClientRect();
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed * dt;

        // Slight side movement for fast enemies
        if (e.shape === 'fast') {
          e.x += Math.sin(Date.now() / 200 + e.y / 50) * 60 * dt;
        }

        // Enemy reached bottom
        if (e.y > rect.height + 30) {
          enemies.splice(i, 1);
          takeDamage(8);
          continue;
        }

        // Collision with player
        if (circleRectIntersect(player.x, player.y - 10, 16, e.x, e.y, e.width, e.height)) {
          enemies.splice(i, 1);
          takeDamage(15);
          spawnParticles(e.x, e.y, e.color, 12);
          playExplosionSound();
          continue;
        }

        // Bullet collision
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (circleRectIntersect(b.x, b.y, 4, e.x, e.y, e.width, e.height)) {
            e.hp--;
            bullets.splice(j, 1);
            spawnParticles(b.x, b.y, '#00f2ff', 4);
            if (e.hp <= 0) {
              score += e.score * level;
              kills++;
              enemies.splice(i, 1);
              spawnParticles(e.x, e.y, e.color, 18);
              spawnPowerUp(e.x, e.y);
              playExplosionSound();
              checkLevelUp();
            }
            break;
          }
        }
      }
    }

    function updatePowerUps(dt) {
      const rect = canvas.getBoundingClientRect();
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += p.speed * dt;
        if (p.y > rect.height + 20) {
          powerUps.splice(i, 1);
          continue;
        }
        if (circleRectIntersect(player.x, player.y - 10, 20, p.x, p.y, p.width, p.height)) {
          applyPowerUp(p.type);
          powerUps.splice(i, 1);
        }
      }
    }

    function updateStars(dt) {
      const rect = canvas.getBoundingClientRect();
      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        s.y += s.speed * dt;
        s.alpha += (Math.random() - 0.5) * dt;
        s.alpha = Math.max(0.1, Math.min(0.8, s.alpha));
        if (s.y > rect.height) stars.splice(i, 1);
      }
      starSpawnTimer -= dt;
      if (starSpawnTimer <= 0) {
        spawnStars();
        starSpawnTimer = 0.04;
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function applyPowerUp(type) {
      playPowerUpSound();
      if (type === 'health') {
        player.health = Math.min(player.maxHealth, player.health + 30);
      } else if (type === 'rapid') {
        player.fireRate = 0.12;
        setTimeout(() => { player.fireRate = 0.35; }, 5000);
      } else if (type === 'shield') {
        player.shield = true;
        setTimeout(() => { player.shield = false; }, 5000);
      }
    }

    function takeDamage(amount) {
      if (player.shield) {
        spawnParticles(player.x, player.y, '#00f2ff', 8);
        return;
      }
      player.health -= amount;
      playDamageSound();
      spawnParticles(player.x, player.y, '#ff2a2a', 6);
      if (player.health <= 0) {
        player.health = 0;
        gameOver();
      }
    }

    function checkLevelUp() {
      const needed = level * 150;
      if (score >= needed) {
        level++;
        enemySpeedBase += 12;
        enemySpawnRate = Math.max(0.55, enemySpawnRate * 0.94);
        levelEl.textContent = level;
        showLevelUp();
        playLevelUpSound();
      }
    }

    function showLevelUp() {
      levelUpBanner.classList.add('show');
      setTimeout(() => levelUpBanner.classList.remove('show'), 1200);
    }

    function circleRectIntersect(cx, cy, r, rx, ry, rw, rh) {
      const closestX = Math.max(rx - rw/2, Math.min(cx, rx + rw/2));
      const closestY = Math.max(ry - rh/2, Math.min(cy, ry + rh/2));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return (dx * dx + dy * dy) <= (r * r);
    }

    // Drawing
    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);

      // Engine flame
      const flameH = 12 + Math.sin(player.engineTimer) * 6;
      ctx.beginPath();
      ctx.moveTo(-8, 12);
      ctx.lineTo(0, 12 + flameH);
      ctx.lineTo(8, 12);
      ctx.closePath();
      ctx.fillStyle = '#ff8800';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff4400';
      ctx.fill();

      // Shield glow
      if (player.shield) {
        ctx.beginPath();
        ctx.arc(0, -5, 30, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 242, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f2ff';
        ctx.stroke();
      }

      // Ship body
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.lineTo(16, 12);
      ctx.lineTo(0, 6);
      ctx.lineTo(-16, 12);
      ctx.closePath();
      ctx.fillStyle = player.color;
      ctx.shadowBlur = 18;
      ctx.shadowColor = player.color;
      ctx.fill();

      // Cockpit
      ctx.beginPath();
      ctx.arc(0, -6, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.restore();
    }

    function drawBullets() {
      ctx.save();
      for (const b of bullets) {
        ctx.beginPath();
        ctx.roundRect(b.x - b.width/2, b.y - b.height/2, b.width, b.height, 2);
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = b.color;
        ctx.fill();
      }
      ctx.restore();
    }

    function drawEnemies() {
      ctx.save();
      for (const e of enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.fillStyle = e.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = e.color;

        if (e.shape === 'tank') {
          ctx.fillRect(-e.width/2, -e.height/2, e.width, e.height);
          ctx.fillStyle = '#ff8888';
          ctx.fillRect(-e.width/2 + 6, -e.height/2 + 6, e.width - 12, 4);
        } else if (e.shape === 'fast') {
          ctx.beginPath();
          ctx.moveTo(0, e.height/2);
          ctx.lineTo(e.width/2, -e.height/2);
          ctx.lineTo(-e.width/2, -e.height/2);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, e.width/2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(0, 0, e.width/4, 0, Math.PI * 2);
          ctx.fill();
        }

        // HP bar for tank
        if (e.maxHp > 1) {
          ctx.fillStyle = '#333';
          ctx.fillRect(-e.width/2, -e.height/2 - 8, e.width, 4);
          ctx.fillStyle = '#00ff88';
          ctx.fillRect(-e.width/2, -e.height/2 - 8, e.width * (e.hp / e.maxHp), 4);
        }
        ctx.restore();
      }
      ctx.restore();
    }

    function drawPowerUps() {
      ctx.save();
      for (const p of powerUps) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.shadowBlur = 12;
        const colors = { health: '#00ff88', rapid: '#ffd700', shield: '#00f2ff' };
        const icons = { health: '+', rapid: '⚡', shield: '🛡' };
        ctx.fillStyle = colors[p.type] || '#fff';
        ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath();
        ctx.arc(0, 0, p.width/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icons[p.type], 0, 1);
        ctx.restore();
      }
      ctx.restore();
    }

    function drawStars() {
      ctx.save();
      for (const s of stars) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.fill();
      }
      ctx.restore();
    }

    function drawParticles() {
      ctx.save();
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawHUD() {
      scoreEl.textContent = score;
      levelEl.textContent = level;
      healthFill.style.width = `${Math.max(0, player.health)}%`;
    }

    // Main loop
    function gameLoop(timestamp) {
      if (!gameRunning) return;
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      if (!gamePaused) {
        updatePlayer(dt);
        updateBullets(dt);
        updateEnemies(dt);
        updatePowerUps(dt);
        updateStars(dt);
        updateParticles(dt);

        enemySpawnTimer -= dt;
        if (enemySpawnTimer <= 0) {
          spawnEnemy();
          enemySpawnTimer = enemySpawnRate;
        }
      }

      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      drawStars();
      drawBullets();
      drawPowerUps();
      drawEnemies();
      drawPlayer();
      drawParticles();
      drawHUD();

      animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      initAudio();
      resizeCanvas();

      // Reset state
      score = 0;
      level = 1;
      kills = 0;
      enemySpawnTimer = 0;
      starSpawnTimer = 0;
      enemySpeedBase = 80;
      enemySpawnRate = 1.2;
      bullets = [];
      enemies = [];
      powerUps = [];
      particles = [];
      stars = [];

      // Reset player
      player.health = player.maxHealth;
      player.fireTimer = 0;
      player.fireRate = 0.35;
      player.shield = false;
      const rect = canvas.getBoundingClientRect();
      player.x = rect.width / 2;
      player.y = rect.height - 80;

      scoreEl.textContent = '0';
      levelEl.textContent = '1';
      bestEl.textContent = bestScore;

      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      document.getElementById('startBtn').textContent = 'Restart';

      gameRunning = true;
      gamePaused = false;
      lastTime = 0;

      // Pre-fill stars
      for (let i = 0; i < 40; i++) spawnStars();

      animationId = requestAnimationFrame(gameLoop);
    }

    function togglePause() {
      if (!gameRunning) return;
      gamePaused = !gamePaused;
      document.getElementById('pauseBtn').textContent = gamePaused ? 'Resume' : 'Pause';
      if (!gamePaused) lastTime = 0;
    }

    function gameOver() {
      gameRunning = false;
      cancelAnimationFrame(animationId);
      playGameOverSound();
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('shooterBest', bestScore);
      }
      finalScore.textContent = score;
      finalLevel.textContent = level;
      finalBest.textContent = bestScore;
      finalKills.textContent = kills;
      gameOverOverlay.classList.remove('hidden');
    }

    // Hide mobile hint if not touch device
    if (!('ontouchstart' in window)) {
      mobileHint.textContent = 'Use ← → arrows or A/D to move • Space to pause';
    }

    // Initial resize
    resizeCanvas();
  </script>
</body>
</html>
