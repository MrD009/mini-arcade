<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🐍 Neon Snake</title>
  <style>
    :root {
      --bg: #0d0d1a;
      --panel: #16162e;
      --accent: #00f2ff;
      --accent2: #ff00aa;
      --gold: #ffd700;
      --text: #f5f5f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom)) 8px;
      overflow: hidden;
      gap: 0;
    }

    header { text-align: center; margin-bottom: 6px; }

    h1 {
      font-size: clamp(1.2rem, 5vw, 2rem);
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0,242,255,0.5);
    }

    .stats {
      display: flex;
      gap: clamp(6px, 2.5vw, 20px);
      margin-bottom: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat {
      background: var(--panel);
      padding: 5px 12px;
      border-radius: 50px;
      font-size: clamp(0.72rem, 2.5vw, 0.95rem);
    }

    .stat span { color: var(--gold); font-weight: bold; }

    .game-wrapper {
      position: relative;
      border: 2px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,242,255,0.2);
      background: #050510;
    }

    canvas {
      display: block;
      border-radius: 10px;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(13,13,26,0.9);
      border-radius: 10px;
      text-align: center;
      padding: 20px;
      z-index: 2;
    }

    .overlay h2 {
      font-size: 1.8rem;
      color: var(--accent2);
      margin-bottom: 10px;
    }

    .overlay p { margin-bottom: 8px; color: #ccc; }

    .controls {
      margin-top: 6px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: var(--accent2);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover { background: var(--accent); transform: scale(1.05); }

    .d-pad {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
      width: clamp(150px, 44vw, 200px);
    }

    .d-pad button {
      aspect-ratio: 1;
      padding: 0;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      background: rgba(22, 22, 46, 0.9);
      border: 1px solid rgba(0, 242, 255, 0.4);
      border-radius: 8px;
    }

    .d-pad .empty { visibility: hidden; }

    @media (max-width: 600px) {
      h1 { font-size: clamp(1.1rem, 5vw, 1.5rem); }
    }
  </style>
</head>
<body>

  <header>
    <h1>🐍 Neon Snake</h1>
  </header>

  <div class="stats">
    <div class="stat">Score: <span id="score">0</span></div>
    <div class="stat">High Score: <span id="highScore">0</span></div>
    <div class="stat">Level: <span id="level">1</span></div>
  </div>

  <div class="game-wrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">🐍 Neon Snake</h2>
      <p id="overlayText">Swipe, use arrow keys, or tap the D-pad.</p>
      <p id="overlayScore"></p>
      <button id="startBtn" onclick="startGame()">Start Game</button>
    </div>
  </div>

  <div class="controls">
    <button onclick="startGame()">Restart</button>
    <button onclick="togglePause()">Pause</button>
    <a href="../../index.html" style="text-decoration:none;">
      <button type="button">🏠 Arcade Home</button>
    </a>
  </div>

  <div class="d-pad" id="dPad">
    <div class="empty"></div>
    <button onclick="setDirection(0, -1)">▲</button>
    <div class="empty"></div>
    <button onclick="setDirection(-1, 0)">◀</button>
    <button onclick="togglePause()">⏸</button>
    <button onclick="setDirection(1, 0)">▶</button>
    <div class="empty"></div>
    <button onclick="setDirection(0, 1)">▼</button>
    <div class="empty"></div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const overlayScore = document.getElementById('overlayScore');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const levelEl = document.getElementById('level');

    let gridSize = 20;
    const tileCount = 20;

    let snake = [];
    let food = {};
    let dx = 0, dy = 0;
    let nextDx = 0, nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
    let level = 1;
    let gameLoop = null;
    let speed = 120;
    let running = false;
    let paused = false;

    highScoreEl.textContent = highScore;

    // Audio
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, delay = 0) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    function playEatSound() {
      playTone(440, 'sine', 0.08);
      playTone(659, 'sine', 0.12, 0.08);
    }

    function playCrashSound() {
      playTone(150, 'sawtooth', 0.25);
      playTone(100, 'sawtooth', 0.35, 0.15);
    }

    function playMoveSound() {
      playTone(220, 'square', 0.03);
    }

    function resizeCanvas() {
      const hasDpad = 'ontouchstart' in window;
      const reservedH = 46   // header
        + 38   // stats
        + 46   // controls
        + (hasDpad ? 185 : 0) // d-pad
        + 36;  // padding/gaps
      const maxW = window.innerWidth - 32; // 16px padding each side
      const maxH = window.innerHeight - reservedH;
      const maxSize = Math.min(maxW, maxH, 400);
      const size = Math.max(Math.floor(maxSize / tileCount) * tileCount, 160);
      canvas.width = size;
      canvas.height = size;
      gridSize = size / tileCount;
    }

    function startGame() {
      initAudio();
      resizeCanvas();
      overlay.style.display = 'none';
      resetGame();
      running = true;
      paused = false;
      gameLoop = setInterval(update, speed);
    }

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      level = 1;
      speed = 120;
      scoreEl.textContent = score;
      levelEl.textContent = level;
      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
    }

    function togglePause() {
      if (!running) {
        startGame();
        return;
      }
      paused = !paused;
      if (paused) {
        clearInterval(gameLoop);
        overlayTitle.textContent = '⏸ Paused';
        overlayText.textContent = 'Press Resume to continue.';
        overlayScore.textContent = '';
        document.getElementById('startBtn').textContent = 'Resume';
        overlay.style.display = 'flex';
      } else {
        overlay.style.display = 'none';
        gameLoop = setInterval(update, speed);
      }
    }

    function setDirection(x, y) {
      if (!running || paused) return;
      // Prevent reversing directly
      if (x === -dx && y === -dy && snake.length > 1) return;
      nextDx = x;
      nextDy = y;
    }

    function update() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10 * level;
        scoreEl.textContent = score;
        playEatSound();
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snakeHighScore', highScore);
        }
        // Level up every 50 points
        if (score > 0 && score % 50 === 0) {
          level++;
          levelEl.textContent = level;
          speed = Math.max(60, speed - 8);
          clearInterval(gameLoop);
          gameLoop = setInterval(update, speed);
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear background
      ctx.fillStyle = '#050510';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid glow
      ctx.strokeStyle = 'rgba(0, 242, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }

      // Draw food with glow
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff00aa';
      ctx.fillStyle = '#ff00aa';
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0, Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw snake
      snake.forEach((seg, i) => {
        const isHead = i === 0;
        ctx.fillStyle = isHead ? '#00f2ff' : '#00b8c4';
        ctx.shadowBlur = isHead ? 15 : 0;
        ctx.shadowColor = '#00f2ff';
        ctx.fillRect(
          seg.x * gridSize + 1,
          seg.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );
      });
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      clearInterval(gameLoop);
      running = false;
      playCrashSound();
      overlayTitle.textContent = '💥 Game Over';
      overlayText.textContent = `Final Score: ${score}`;
      overlayScore.textContent = score > highScore ? '🎉 New High Score!' : `High Score: ${highScore}`;
      document.getElementById('startBtn').textContent = 'Play Again';
      overlay.style.display = 'flex';
    }

    // Keyboard controls
    document.addEventListener('keydown', e => {
      initAudio();
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); break;
        case 'ArrowDown': case 's': case 'S': setDirection(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); break;
        case ' ': case 'Escape': togglePause(); break;
      }
    });

    // Touch / swipe controls
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', e => {
      if (!running || paused) return;
      const dxTouch = e.changedTouches[0].clientX - touchStartX;
      const dyTouch = e.changedTouches[0].clientY - touchStartY;
      if (Math.sqrt(dxTouch * dxTouch + dyTouch * dyTouch) < 20) return; // ignore tiny taps
      if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
        setDirection(dxTouch > 0 ? 1 : -1, 0);
      } else {
        setDirection(0, dyTouch > 0 ? 1 : -1);
      }
    }, { passive: true });

    // Show d-pad on touch devices
    if ('ontouchstart' in window) {
      document.getElementById('dPad').style.display = 'grid';
    }

    // Resize canvas on orientation change / window resize
    window.addEventListener('resize', () => { resizeCanvas(); if (!running) draw(); });

    // Initial size and draw
    resizeCanvas();
    resetGame();
  </script>
</body>
</html>
